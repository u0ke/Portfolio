<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li onclick="showSection('about-section')" class="active">About Me</li>
            <li onclick="showSection('skills-section')">Skills</li>
            <li onclick="showSection('projects-section')">Projects</li>
        </ul>
        <a href="index.html" class="back-link">← Back to Portfolio</a>
    </div>

    <div class="main-content">
        <div id="about-section" class="admin-section active">
            <h2>Update About Me</h2>
            <form id="about-form">
                <label>Profile Text:</label>
                <textarea id="about-text" rows="4"></textarea>
                
                <label>Profile Photo:</label>
                <input type="file" id="about-image" accept="image/*">
                
                <button type="submit">Save About</button>
            </form>
        </div>

        <div id="skills-section" class="admin-section" style="display:none;">
            <h2>Update Skills</h2>
            <textarea id="skills-input" rows="4" placeholder="Enter skills separated by commas (e.g. HTML, CSS, JavaScript)"></textarea>
            <button onclick="saveSkills()">Save Skills</button>
        </div>

        <div id="projects-section" class="admin-section" style="display:none;">
            <h2>Add New Project</h2>
            <form id="project-form">
                <label>Project Title:</label>
                <input type="text" id="proj-title" required>
                
                <label>Description:</label>
                <textarea id="proj-desc" rows="2" required></textarea>
                
                <label>Preview Photo:</label>
                <input type="file" id="proj-image" accept="image/*" required>
                
                <button type="submit">Add Project</button>
            </form>

            <hr>
            <h2>Manage Projects</h2>
            <div id="admin-projects-list"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
