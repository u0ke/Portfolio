<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Hamza Bari</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-soft);
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }
    .login-head { text-align: center; margin-bottom: 28px; }
    .login-mark {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--gradient);
      display: grid; place-items: center;
      font-weight: 700; margin: 0 auto 16px;
      color: white;
    }
    .login-head h1 { font-size: 24px; letter-spacing: -0.02em; margin-bottom: 6px; }
    .login-head p { font-size: 14px; color: var(--text-soft); }
    .login-form { display: grid; gap: 14px; }
    .login-error {
      font-size: 13px; color: #fca5a5; text-align: center;
      display: none; padding: 10px;
      background: rgba(255, 80, 80, 0.08);
      border-radius: 6px;
      border: 1px solid rgba(255, 80, 80, 0.2);
    }
    .login-error.is-show { display: block; }
    .login-foot { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-mute); }
    .login-foot a { color: var(--text-soft); }
    .login-foot a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="login-page">
    <div class="login-card">
      <div class="login-head">
        <div class="login-mark">HB</div>
        <h1>Admin Login</h1>
        <p>Sign in to manage your portfolio.</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="field">
          <label for="lg-user">Username</label>
          <input type="text" id="lg-user" name="username" autocomplete="username" placeholder="admin" required />
        </div>
        <div class="field">
          <label for="lg-pass">Password</label>
          <input type="password" id="lg-pass" name="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <div class="login-error" id="loginError">Invalid credentials. Try again.</div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
      <div class="login-foot">
        <a href="index.html">← Back to portfolio</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      const SESSION_KEY = 'hb_admin_session';
      const form = document.getElementById('loginForm');
      const errEl = document.getElementById('loginError');

      // If already logged in, redirect to admin
      if (sessionStorage.getItem(SESSION_KEY)) {
        window.location.replace('admin.html');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = document.getElementById('lg-user').value.trim();
        const pass = document.getElementById('lg-pass').value;

        let admin = { username: 'admin', password: 'hamza2026' };
        try {
          const res = await fetch('data/portfolio.json?v=' + Date.now(), { cache: 'no-store' });
          if (res.ok) {
            const json = await res.json();
            if (json.admin) admin = json.admin;
          }
        } catch (_) { /* use fallback */ }

        if (user === admin.username && pass === admin.password) {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify({ user, time: Date.now() }));
          errEl.classList.remove('is-show');
          window.location.href = 'admin.html';
        } else {
          errEl.textContent = 'Invalid credentials. Try again.';
          errEl.classList.add('is-show');
        }
      });
    })();
  </script>
</body>
</html>
