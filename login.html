<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Hamza Bari</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Geist', 'system-ui', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            ink: '#000000',
            surface: '#0a0a0a',
            bone: '#ffffff',
            paper: '#e8e8e8',
            mute: '#b3b3b3',
            mist: '#a3a3a3',
            edge: '#1a1a1a',
            'edge-hover': '#222222',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%BA%3C/text%3E%3C/svg%3E" />
  <style>
    html, body { background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%); color: #ffffff; }
    ::selection { background: rgba(255, 255, 255, 0.20); }
  </style>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="text-mute font-sans antialiased min-h-screen flex items-center justify-center px-6 relative overflow-hidden">

  <div class="fixed inset-0 -z-10 hero-glow pointer-events-none"></div>

  <a href="index.html" class="absolute top-6 left-6 text-sm text-mist hover:text-bone inline-flex items-center gap-2 transition">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M19 12H5"/></svg>
    Back to site
  </a>

  <main class="w-full max-w-sm">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-white/[0.03] border border-edge mb-6">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight mb-2 text-bone">Admin Login</h1>
      <p class="text-sm text-mist">Sign in to manage your portfolio content.</p>
    </div>

    <form id="loginForm" class="rounded-2xl border border-edge bg-[#0a0a0a] p-8 space-y-6" autocomplete="off">
      <div>
        <label class="block font-mono text-[10px] uppercase tracking-[0.05em] text-mist mb-2" for="username">Username</label>
        <input id="username" name="username" type="text" required
          class="w-full bg-transparent border-0 border-b border-white/10 focus:border-paper focus:ring-0 focus:outline-none px-0 py-3 text-bone text-sm placeholder-white/20 transition-colors"
          placeholder="ice" />
      </div>
      <div>
        <label class="block font-mono text-[10px] uppercase tracking-[0.05em] text-mist mb-2" for="password">Password</label>
        <div class="relative">
          <input id="password" name="password" type="password" required
            class="w-full bg-transparent border-0 border-b border-white/10 focus:border-paper focus:ring-0 focus:outline-none px-0 py-3 pr-10 text-bone text-sm placeholder-white/20 transition-colors"
            placeholder="••••••••" />
          <button type="button" id="togglePwd" class="absolute right-0 top-1/2 -translate-y-1/2 text-mist hover:text-bone p-2 transition" aria-label="Show password">
            <svg id="eyeOn" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div id="loginError" class="hidden text-sm text-red-300 bg-red-500/10 border border-red-400/20 rounded-lg px-4 py-2.5"></div>

      <button type="submit" class="w-full px-7 py-2.5 rounded-full bg-paper text-ink font-medium text-sm hover:bg-bone transition">
        Sign In
      </button>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      if (window.IceAuth && window.IceAuth.isAuthenticated()) {
        window.location.href = 'admin.html';
        return;
      }

      const form = document.getElementById('loginForm');
      const err = document.getElementById('loginError');
      const toggle = document.getElementById('togglePwd');
      const pwd = document.getElementById('password');

      toggle.addEventListener('click', () => {
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
      });

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        err.classList.add('hidden');
        const u = document.getElementById('username').value.trim();
        const p = pwd.value;
        if (window.IceAuth.login(u, p)) {
          window.location.href = 'admin.html';
        } else {
          err.textContent = 'Invalid credentials. Please try again.';
          err.classList.remove('hidden');
          pwd.value = '';
          pwd.focus();
        }
      });
    })();
  </script>
</body>
</html>
